name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Lint and Type Check ──────────────────────────────────────────────────────
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npx tsc --noEmit

      - name: Security audit
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: false

  # ─── Unit Tests and Property Tests ────────────────────────────────────────────
  unit-tests:
    name: Unit & Property Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run unit tests
        run: npm run test:unit

      - name: Run property tests
        run: npm run test:property

  # ─── Integration Tests ────────────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: api_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d api_testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/api_testing
      JWT_SECRET: ci-test-jwt-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      NODE_ENV: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run integration tests
        run: npm run test:integration

  # ─── Docker Build and Health Check ────────────────────────────────────────────
  docker-build:
    name: Docker Build & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: api-testing-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start services with Docker Compose
        run: |
          docker compose up -d
        env:
          PORT: 3000
          JWT_SECRET: ci-docker-jwt-secret
          JWT_REFRESH_SECRET: ci-docker-refresh-secret

      - name: Wait for API health check
        run: |
          echo "Waiting for API to be healthy..."
          timeout=60
          elapsed=0
          until curl -sf http://localhost:3000/health > /dev/null 2>&1; do
            if [ $elapsed -ge $timeout ]; then
              echo "Health check failed after ${timeout}s"
              docker compose logs api
              exit 1
            fi
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "API is healthy after ${elapsed}s"

      - name: Verify health endpoint response
        run: |
          response=$(curl -sf http://localhost:3000/health)
          echo "Health check response: $response"

      - name: Stop services
        if: always()
        run: docker compose down -v

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'api-testing-backend:ci'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL'
          timeout: '10m'

      - name: Run Trivy (full report)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'api-testing-backend:ci'
          format: 'json'
          output: 'trivy-results.json'
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-scan-results
          path: trivy-results.json
          retention-days: 30

  # ─── Deploy to Local Docker ─────────────────────────────────────────────────
  deploy-local:
    name: Deploy to Local Docker
    runs-on: [self-hosted, windows]
    needs: [lint-and-typecheck, unit-tests, integration-tests, docker-build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Stop existing containers
        run: docker compose down --remove-orphans
        working-directory: ${{ github.workspace }}
        continue-on-error: true

      - name: Rebuild and restart Docker containers
        run: docker compose up -d --build
        working-directory: ${{ github.workspace }}

      - name: Wait for API health check
        run: |
          echo "Waiting for API to be healthy..."
          $timeout = 90
          $elapsed = 0
          while ($elapsed -lt $timeout) {
            try {
              $response = Invoke-WebRequest -Uri http://localhost:3000/health -UseBasicParsing -ErrorAction Stop
              if ($response.StatusCode -eq 200) {
                echo "API is healthy after ${elapsed}s"
                exit 0
              }
            } catch {}
            Start-Sleep -Seconds 3
            $elapsed += 3
          }
          echo "Health check failed after ${timeout}s"
          docker compose logs api
          exit 1
        shell: powershell
